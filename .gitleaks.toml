# gitleaks configuration — the leak-prevention backstop (CI runs gitleaks on every
# PR + push; see .github/workflows/gitleaks.yml). Extends the default ruleset with a
# tight allowlist for values that are intentionally public (runtime identifiers, not
# secrets) and for non-source directories.
#
# This catches accidentally-committed SECRET VALUES (tokens, keys) via the default
# ruleset over the FULL git history. op:// 1Password PATH hygiene is a separate concern
# (references, not secrets — and history can't be un-leaked), handled by the working-tree
# grep step in .github/workflows/gitleaks.yml + AGENTS.md "Public Repo"; the concrete
# vault/item map lives in the private companion repo (AGENTS.md "Private companion").
title = "Fluncle gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Intentionally-public identifiers (runtime config, not secrets)"
regexTarget = "match"
regexes = [
  # The Cloudflare R2 account id is a runtime Worker binding (apps/web/cloudflare.config.ts) — a
  # public account IDENTIFIER, not a credential. It is useless without the actual
  # R2 token, which is a Worker secret and never in the repo.
  '''0651fd3b33d9e0b2fe72a5f13e5cf65d''',
  # The IndexNow ownership token, served publicly at /<key>.txt so search engines can
  # verify domain ownership before accepting URL submissions. Public by design — it is
  # not a credential and grants nothing beyond proving we control the served file.
  '''8337c1b41068549f248bf56f1fc465df''',
  # The Cloudflare cache-purge ZONE id, a plain var in apps/web/cloudflare.config.ts. Same
  # rationale as the R2 account id above: a public zone IDENTIFIER naming which zone to
  # purge, useless without the Cache-Purge-scoped CF_CACHE_PURGE_TOKEN, which is a
  # Worker secret and never in the repo.
  '''93b403e3d6ed70d10cdd2890c557376f''',
  # The two Sentry DSN public keys (browser + Worker), committed in
  # apps/web/src/lib/sentry-config.ts. A DSN is a PUBLIC ingestion identifier — like
  # the R2 account id above, it names where events go but grants nothing on its own
  # (ingestion is one-way; reading issues needs the auth token, which is never in the
  # repo). See docs/error-tracking.md.
  '''b7fe8117b1aa9848d5f8252a65e8b9ae''',
  '''9843d82b6f64fef790791e58047ed52b''',
  # Feed content-type MIME strings in the surfaces registry (`apiFormat`) — RSS/Atom/
  # JSON-Feed media types, not secrets. gitleaks' generic-api-key rule false-positives
  # the `...+xml` / `...+json` media types.
  '''application/(rss|atom)\+xml''',
  '''application/feed\+json''',
]
# Only DERIVED trees are excluded — build output, vendored deps, lockfiles. Anything
# hand-written is scanned, including `.claude/` and `.agents/` (agent defs, hooks, and
# the installed skill copies: ~500 tracked files that are prose ABOUT operator
# procedures, which is exactly where a pasted token would land). They were excluded
# wholesale until this pass; the tree and the full history both scan clean without the
# exclusion, so there is nothing to trade for the coverage.
[[allowlists]]
description = "Derived trees — build output, vendored deps, lockfiles"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.dev/''',
  '''(^|/)dist/''',
  '''(^|/)\.output/''',
  '''(^|/)\.source/''',
  '''(^|/)bun\.lock$''',
]

# The mobile app's AsyncStorage key names (`STORAGE_KEY = "fluncle.<store>.v1"`) — local
# storage namespaces, not credentials. The `KEY` keyword plus the dotted name sits right
# at generic-api-key's 3.5 entropy floor: "fluncle.saved.v1" scrapes under, "fluncle.mix.v1"
# lands a hair over and reddened CI. Path-conditioned (AND) rather than global: an unanchored
# match-target regex in the global allowlist would exempt ANY finding that merely contains
# the pattern — e.g. a real key pasted as `"fluncle.prod.v1-<token>"` — anywhere in the repo.
[[allowlists]]
description = "mobile AsyncStorage key names"
condition = "AND"
paths = ['''(^|/)apps/mobile/src/lib/''']
regexTarget = "match"
regexes = ['''fluncle\.[a-z0-9.-]+\.v\d+''']
