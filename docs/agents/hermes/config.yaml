# Fluncle Hermes gateway config. Non-secret only — the container's env comes from
# `--env-file /etc/hermes.env` (FLUNCLE_API_TOKEN, DISCORD_ALERT_WEBHOOK). Deployed to
# ~/.hermes/config.yaml on the devbox. See docs/agents/hermes-agent.md.
#
# The gateway carries no chat platform and no model: every recurring job is a host systemd
# timer that `docker exec`s into this container, and every authoring step is `claude -p` on
# subscription auth. The gateway process only keeps the container alive, so it holds no
# OpenRouter key and no Discord bot token. Discord alerts post through the webhook.

# Cron: raise the `--no-agent` script timeout from the 120s default. Resolution order is env
# var (HERMES_CRON_SCRIPT_TIMEOUT) → this setting → the 120s default.
cron:
  script_timeout_seconds: 300
