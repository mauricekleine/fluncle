name: Dependency Audit

# Dependabot does not parse bun.lock, so its alert queue misses advisories that
# Bun can see. This workflow closes that blind spot.
#
# This check is BLOCKING: a non-allowlisted advisory at or above `high` fails it.
# Advisory drift can therefore redden a branch with no code change behind it —
# that is the point, and the fix is a parent bump or a newly justified allowlist
# entry, never a quiet threshold change. The `--ignore` allowlist lives in the
# root `audit` script (package.json) so local runs and CI report the same set;
# every entry's justification and the severity policy live in the
# fluncle-maintenance skill (packages/skills/fluncle-maintenance, "Dependency
# vulnerability posture"). Marking this check REQUIRED is a separate branch
# protection setting, not a change to this file.
#
# `bun audit` reads bun.lock directly, so this job does not need an install step.
#
# The two steps below are deliberately two invocations, and they are not
# interchangeable. `bun audit --json` silently ignores BOTH --audit-level and
# --ignore: it dumps every advisory at every severity, allowlisted ones included,
# and exits non-zero whenever it finds any. Its exit status therefore says
# nothing about policy and must never be the gate. So the report step runs JSON
# for its severity table, and the gate step runs the plain `audit` script that
# actually carries the policy. Reporting goes first so a red gate always arrives
# with its table already attached.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # Monday ~04:17 CET / 05:17 CEST

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: dependency-audit-${{ github.ref }}

jobs:
  audit:
    name: Audit bun.lock dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json # single source: packageManager — pin-drift bumps that, every workflow follows

      - name: Report audit findings
        env:
          AUDIT_ERROR: ${{ runner.temp }}/bun-audit.stderr
          AUDIT_OUTPUT: ${{ runner.temp }}/bun-audit.json
        run: |
          # Reporting only — this step never gates, so its status is captured rather
          # than raised. `bun audit --json` exits non-zero on any finding at any
          # severity and honours neither the threshold nor the allowlist.
          json_status=0
          bun audit --json > "$AUDIT_OUTPUT" 2> "$AUDIT_ERROR" || json_status=$?

          {
            echo "## Dependency audit"
            echo
            echo "Every advisory Bun can see, at every severity, allowlisted entries included. The gate is the next step — \`bun run audit\`, which applies \`--audit-level=high\` minus the \`--ignore\` allowlist. Counts here can be non-zero on a passing check."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s "$AUDIT_OUTPUT" ] && [ "$json_status" -eq 0 ]; then
            echo "No advisories at any severity. Nothing to report." >> "$GITHUB_STEP_SUMMARY"
          elif jq -e 'type == "object" and all(.[]; type == "array")' "$AUDIT_OUTPUT" > /dev/null 2>&1; then
            {
              echo "| Severity | Advisories |"
              echo "| --- | ---: |"
              jq -r '
                [.. | objects | .severity? | select(type == "string") | ascii_downcase] as $severities
                | ["critical", "high", "moderate", "low"][] as $severity
                | "| \(($severity[0:1] | ascii_upcase) + $severity[1:]) | \([$severities[] | select(. == $severity)] | length) |"
              ' "$AUDIT_OUTPUT"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "The npm registry request did not return a valid advisory response. This is an audit availability failure, not a security finding — read the gate step below for the verdict."
              echo
              echo "<details><summary>Raw audit output (first 200 lines per stream)</summary>"
              echo
              echo '````text'
              sed -n '1,200p' "$AUDIT_ERROR"
              sed -n '1,200p' "$AUDIT_OUTPUT"
              echo '````'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The gate. Its exit code is this check. Never add `--json` here — see the
      # header comment: JSON mode discards the threshold and the allowlist.
      - name: Audit dependencies
        run: bun run audit
