name: Dependency Audit

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: dependency-audit-${{ github.ref }}

jobs:
  audit:
    name: Audit bun.lock dependencies
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Report audit findings
        env:
          AUDIT_ERROR: ${{ runner.temp }}/bun-audit.stderr
          AUDIT_OUTPUT: ${{ runner.temp }}/bun-audit.json
        run: |
          json_status=0
          bun audit --json > "$AUDIT_OUTPUT" 2> "$AUDIT_ERROR" || json_status=$?

          {
            echo "## Dependency audit"
            echo
            echo "Every advisory Bun can see, at every severity, allowlisted entries included. The gate is the next step — \`bun run audit\`, which applies \`--audit-level=high\` minus the \`--ignore\` allowlist. Counts here can be non-zero on a passing check."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s "$AUDIT_OUTPUT" ] && [ "$json_status" -eq 0 ]; then
            echo "No advisories at any severity. Nothing to report." >> "$GITHUB_STEP_SUMMARY"
          elif jq -e 'type == "object" and all(.[]; type == "array")' "$AUDIT_OUTPUT" > /dev/null 2>&1; then
            {
              echo "| Severity | Advisories |"
              echo "| --- | ---: |"
              jq -r '
                [.. | objects | .severity? | select(type == "string") | ascii_downcase] as $severities
                | ["critical", "high", "moderate", "low"][] as $severity
                | "| \(($severity[0:1] | ascii_upcase) + $severity[1:]) | \([$severities[] | select(. == $severity)] | length) |"
              ' "$AUDIT_OUTPUT"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "The npm registry request did not return a valid advisory response. This is an audit availability failure, not a security finding — read the gate step below for the verdict."
              echo
              echo "<details><summary>Raw audit output (first 200 lines per stream)</summary>"
              echo
              echo '````text'
              sed -n '1,200p' "$AUDIT_ERROR"
              sed -n '1,200p' "$AUDIT_OUTPUT"
              echo '````'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Audit dependencies
        run: bun run audit
