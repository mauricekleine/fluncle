name: Hermes Pin Drift

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Releases"]
    types: [completed]

concurrency:
  cancel-in-progress: false
  group: hermes-pin-drift

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  drift:
    name: Check + bump baked Hermes pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.PIN_DRIFT_TOKEN || github.token }}

      - name: Detect drift + apply the safe bumps
        id: drift
        run: bash .github/scripts/hermes-pin-drift.sh --apply

      - name: Open a PR for the safe bumps
        if: steps.drift.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.PIN_DRIFT_TOKEN || github.token }}
          PR_TITLE: ${{ steps.drift.outputs.pr_title }}
          AUTOMERGE: ${{ secrets.PIN_DRIFT_TOKEN != '' }}
        run: |
          set -euo pipefail
          open_pr="$(gh pr list --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("hermes-pin-drift/"))][0].number')"
          if [ -n "$open_pr" ]; then
            open_title="$(gh pr view "$open_pr" --json title --jq .title)"
            open_mergeable="$(gh pr view "$open_pr" --json mergeable --jq .mergeable)"
            if [ "$open_title" = "$PR_TITLE" ] && [ "$open_mergeable" != "CONFLICTING" ]; then
              echo "pin-drift PR #$open_pr already carries these bumps — updating its branch so auto-merge can land."
              gh pr update-branch "$open_pr" || echo "update-branch: already current."
              exit 0
            fi
            echo "pin-drift PR #$open_pr is stale or conflicting ($open_mergeable) — superseding it."
            gh pr close "$open_pr" --delete-branch \
              --comment "Superseded by hermes-pin-drift run ${{ github.run_id }}: $PR_TITLE"
          fi
          branch="hermes-pin-drift/${{ github.run_id }}"
          if [ "$AUTOMERGE" = "true" ]; then
            token_user="$(gh api user --jq '"\(.id) \(.login)"')"
            git config user.name "${token_user#* }"
            git config user.email "${token_user%% *}+${token_user#* }@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git checkout -b "$branch"
          git add docs/agents/hermes/Dockerfile package.json
          git commit -m "$PR_TITLE"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "$PR_TITLE" --body-file "${RUNNER_TEMP}/pin-drift-pr-body.md"
          if [ "$AUTOMERGE" = "true" ]; then
            gh pr merge "$branch" --auto --squash --delete-branch \
              || echo "auto-merge unavailable (enable it + branch protection) — leaving the PR for review."
          fi

      - name: Report risky drift as an issue
        if: steps.drift.outputs.braked == 'true'
        env:
          GH_TOKEN: ${{ secrets.PIN_DRIFT_TOKEN || github.token }}
          BRAKE_SIGNATURE: ${{ steps.drift.outputs.brake_signature }}
        run: |
          set -euo pipefail
          title="Hermes supply-chain: drift needs an operator decision"
          existing="$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            latest="$(gh issue view "$existing" --json body,comments \
              --jq 'if (.comments | length) > 0 then .comments[-1].body else .body end')"
            if grep -qF "brake-signature: $BRAKE_SIGNATURE" <<<"$latest"; then
              echo "brake items unchanged since the last report on #$existing — not re-commenting."
              exit 0
            fi
            gh issue comment "$existing" --body-file "${RUNNER_TEMP}/pin-drift-issue-body.md"
          else
            gh issue create --title "$title" --body-file "${RUNNER_TEMP}/pin-drift-issue-body.md"
          fi
