name: Sonar Release

# The CI half of sonar's self-deploy loop (the box half is
# apps/sonar/deploy/fluncle-sonar-freshen.sh). Every merge to main that touches
# apps/sonar/** builds ONE static musl binary here and publishes it to a rolling
# pre-release; the box polls that release, verifies the checksum, pre-smokes the
# binary in isolation, and swaps it in.
#
# Why the build lives here and NOT on the box (the deliberate divergence from
# apps/ssh, which builds on-box): a `cargo build --release` of sonar is ~7-14 min on
# rave-01's two shared vCPUs and needs a ~1.5GB Rust toolchain on the deliberately
# minimal public edge box — which is simultaneously serving the SSH terminal, DNS,
# and sonar itself. Go's toolchain is tiny and its build is ~10s; Rust's is neither.
# Full reasoning: apps/sonar/deploy/README.md.

on:
  push:
    branches: [main]
    paths:
      - apps/sonar/**
  workflow_dispatch:

concurrency:
  cancel-in-progress: false
  group: sonar-release-main

permissions:
  contents: read

env:
  RELEASE_TAG: sonar-latest
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    name: Build + publish the static musl sonar binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create/move the rolling tag and upload the release assets
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Rust (with the musl target)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      # The runner is x86_64, so this is a native-arch / different-libc build: the
      # musl target plus musl-gcc is all it needs (`ring` builds fine this way). No
      # cross/zigbuild container required.
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Cache Cargo (apps/sonar)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/sonar/target
          key: cargo-musl-${{ runner.os }}-${{ hashFiles('apps/sonar/Cargo.lock') }}
          restore-keys: |
            cargo-musl-${{ runner.os }}-

      # `-C target-cpu=x86-64-v3` unlocks AVX2 + FMA in the scan kernel, which IS the
      # point of this service — sonar is a brute-force dot-product scan over the whole
      # corpus, so the SIMD width is the latency. rave-01 is AMD EPYC-Rome (Zen 2):
      # AVX2 + FMA confirmed present.
      #
      # The safety net if that assumption ever breaks (a box migration to older
      # silicon): the binary would SIGILL the moment it runs, and the box-side
      # PRE-SMOKE boots it in isolation before any swap — so a bad-ISA artifact fails
      # validation with the live service untouched and gets alerted, never deployed.
      # `GIT_SHA` is baked into the binary (`option_env!`, apps/sonar/src/server.rs) and
      # reported on `GET /health`. It is what lets an operator confirm the box actually
      # carries a given commit BEFORE flipping a dark flag that depends on it — the box
      # self-deploys on an hourly timer, so "merged" and "running" are different moments.
      # rustc records `option_env!` reads in its dep-info, so Cargo's cache invalidates
      # when this value changes and a stale SHA cannot be baked from the restored cache.
      - name: Build the static musl release binary
        env:
          GIT_SHA: ${{ github.sha }}
          RUSTFLAGS: -C target-cpu=x86-64-v3 -C strip=symbols
        run: cargo build --release --locked --manifest-path apps/sonar/Cargo.toml --target "$TARGET"

      # Three assets, one identity: the binary, its checksum (the box's trust boundary
      # — it did not build this, so verification replaces "we compiled it ourselves"),
      # and the commit it was built from (what the box compares against to decide
      # whether there is anything to do).
      - name: Stage the release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "apps/sonar/target/$TARGET/release/sonar" dist/sonar
          chmod +x dist/sonar
          ( cd dist && sha256sum sonar > sonar.sha256 )
          printf '%s\n' "$GITHUB_SHA" > dist/sonar.commit
          file dist/sonar
          ls -l dist
          cat dist/sonar.sha256

      # A ROLLING tag: `sonar-latest` always points at the commit whose binary is
      # published, so the tag, the release, and the `sonar.commit` asset agree. The
      # box never reads the tag — `sonar.commit` is its source of truth — but a human
      # landing on the release should not see it pinned to an ancient commit.
      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"

          notes="Rolling pre-release: the static musl \`sonar\` binary for rave-01, built from ${GITHUB_SHA}.

          Pulled automatically by the box-side self-deploy (\`apps/sonar/deploy/fluncle-sonar-freshen.sh\`), which verifies \`sonar.sha256\` before it goes anywhere near the live service. Not a versioned release — it is overwritten on every merge that touches \`apps/sonar/**\`."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes "$notes" --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "sonar (latest build)" \
              --notes "$notes" \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" \
            dist/sonar dist/sonar.sha256 dist/sonar.commit \
            --clobber
