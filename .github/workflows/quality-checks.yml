name: Quality Checks

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: false
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, Format, and Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout-ref || github.sha }}

      # Migrations are APPEND-ONLY: a merge must never delete a migration file that exists on
      # main. This is the parallel-migration collision guard — a PR generated when main held
      # migration N, merged after another session landed a different N, silently clobbers that
      # migration (the JSON journal auto-merges without conflict; it happened live 2026-07-27
      # and main had to be reset). A red check here is what prose could not be.
      - name: Migrations are append-only
        run: |
          # The triple-dot diff needs a MERGE BASE, which two depth-1 histories cannot
          # contain — a stale branch (every overnight Renovate branch) then dies with
          # "no merge base" instead of being checked. Fetch main fully and deepen the
          # shallow PR-side history until the fork point is reachable.
          git fetch origin main
          tries=0
          until git merge-base origin/main HEAD >/dev/null 2>&1; do
            tries=$((tries + 1))
            if [ "$tries" -gt 20 ]; then
              echo "::error::Could not reach a merge base with origin/main after deepening — fetch the branch history manually."
              exit 1
            fi
            git fetch --deepen=200 origin || break
          done
          deleted="$(git diff --diff-filter=D --name-only origin/main...HEAD -- apps/web/drizzle/)"
          if [ -n "$deleted" ]; then
            echo "::error::This branch DELETES migration files that exist on main — a parallel-migration collision. Rebase onto main, drop your drizzle artifacts, and re-run db:generate so your migration takes the next free number."
            echo "$deleted"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/ssh/go.mod
          cache-dependency-path: |
            apps/ssh/go.sum
            apps/dns/go.sum

      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Run Oxlint
        run: bun run lint

      - name: Run Format Check
        run: bun run format:check

      - name: Run Typecheck
        run: bun run typecheck

      - name: Run Tests
        run: bun run test

      # The Hermes sweep + track-enrichment scripts live outside the workspaces, so
      # `turbo run test` never sees them — ~400 tests, including the proof that their
      # no-network rail is armed, went unrun until this step existed.
      - name: Run Script Tests
        run: bun run test:scripts

      - name: Build Go (apps/ssh)
        run: go build -C apps/ssh ./...

      - name: Vet Go (apps/ssh)
        run: go vet -C apps/ssh ./...

      - name: Test Go (apps/ssh)
        run: go test -C apps/ssh ./...

      - name: Check Go formatting (apps/ssh)
        run: test -z "$(gofmt -l apps/ssh)"

      - name: Build Go (apps/dns)
        run: go build -C apps/dns ./...

      - name: Vet Go (apps/dns)
        run: go vet -C apps/dns ./...

      - name: Test Go (apps/dns)
        run: go test -C apps/dns ./...

      - name: Check Go formatting (apps/dns)
        run: test -z "$(gofmt -l apps/dns)"

      # apps/sonar — Fluncle's first Rust app (the in-memory vector sidecar).
      # Same "non-TS app in apps/" pattern as apps/ssh and apps/dns above.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo (apps/sonar)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/sonar/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/sonar/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check Rust formatting (apps/sonar)
        run: cargo fmt --manifest-path apps/sonar/Cargo.toml --check

      - name: Lint Rust (apps/sonar)
        run: cargo clippy --manifest-path apps/sonar/Cargo.toml --all-targets -- -D warnings

      - name: Build Rust (apps/sonar)
        run: cargo build --release --manifest-path apps/sonar/Cargo.toml

      - name: Test Rust (apps/sonar)
        run: cargo test --manifest-path apps/sonar/Cargo.toml
