name: Quality Checks

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

permissions:
  contents: read

env:
  TURBO_CACHE_DIR: .turbo/cache
  QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
  QUALITY_FORCE_FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  QUALITY_HEAD: ${{ github.sha }}

jobs:
  pr_state:
    name: PR readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      contents: read
      actions: read
    outputs:
      run: ${{ steps.live.outputs.run }}
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - name: Read live PR draft state
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PAYLOAD_DRAFT: ${{ toJSON(github.event.pull_request.draft) }}
        shell: bash
        run: |
          set -euo pipefail
          live_draft=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            live_draft=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.draft')
          fi
          case "$live_draft" in
            false) run=true ;;
            true) run=false ;;
            *) echo "::error::Invalid live PR draft state: $live_draft"; exit 1 ;;
          esac
          echo "payload_draft=$PAYLOAD_DRAFT live_draft=$live_draft run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Checkout main proof resolver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reuse successful PR tree proof on main
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/quality/source-proof.mjs assess

  core:
    name: Selected quality lanes
    outputs:
      turbo_cache_key: ${{ steps.turbo_cache.outputs.cache-primary-key }}
      cargo_cache_key: ${{ steps.cargo_cache.outputs.cache-primary-key }}
    needs: pr_state
    if: ${{ !cancelled() && needs.pr_state.outputs.run != 'false' && needs.pr_state.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify dependency closure
        id: classify
        run: |
          args=(--base "$QUALITY_BASE" --head "$QUALITY_HEAD" --output "$RUNNER_TEMP/quality-plan.json" --github-output "$GITHUB_OUTPUT")
          if [ "$QUALITY_FORCE_FULL" = "true" ]; then
            args+=(--force-full --full-reason "scheduled or operator-requested full backstop")
          fi
          node scripts/quality/classify.mjs "${args[@]}"

      - name: Start quality report
        run: |
          {
            echo "## Evidence-directed quality"
            echo
            echo "| Lane | Outcome | Duration |"
            echo "| --- | --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Calculate rotating cache epoch
        id: cache_epoch
        if: steps.classify.outputs.turbo == 'true' || steps.classify.outputs.sonar == 'true'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore bounded Turbo snapshot
        id: turbo_cache
        if: steps.classify.outputs.turbo == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-v2-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ steps.cache_epoch.outputs.week }}
          restore-keys: |
            turbo-v2-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json') }}-
            turbo-v2-${{ runner.os }}-

      - name: Install Bun canary for lint
        env:
          BUN_CANARY_DIR: ${{ runner.temp }}/bun-canary
        run: |
          bun scripts/bun-canary.ts --revision
          echo "$BUN_CANARY_DIR" >> "$GITHUB_PATH"

      - name: Run static policy
        run: node scripts/quality/measure.mjs --lane static --metrics "$RUNNER_TEMP/quality-metrics.jsonl" -- node scripts/quality/run-lane.mjs --plan "$RUNNER_TEMP/quality-plan.json" --lane static

      - name: Migrations are append-only
        if: steps.classify.outputs.migrations == 'true'
        env:
          BASE_SHA: ${{ steps.classify.outputs.base }}
          HEAD_SHA: ${{ steps.classify.outputs.head }}
        run: |
          deleted="$(git diff --diff-filter=D --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web/drizzle/)"
          if [ -n "$deleted" ]; then
            echo "::error::This change deletes append-only migration artifacts. Rebase, regenerate, and preserve every migration already on main."
            echo "$deleted"
            exit 1
          fi

      - name: Run affected TypeScript build, typecheck, and tests
        if: steps.classify.outputs.turbo == 'true'
        run: node scripts/quality/measure.mjs --lane packages --metrics "$RUNNER_TEMP/quality-metrics.jsonl" -- node scripts/quality/run-lane.mjs --plan "$RUNNER_TEMP/quality-plan.json" --lane packages

      - name: Setup uv for label-triage Python tests
        if: steps.classify.outputs.label_triage_python == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.13.5"

      - name: Run label-triage Python tests
        if: steps.classify.outputs.label_triage_python == 'true'
        run: node scripts/quality/measure.mjs --lane label-triage-python --metrics "$RUNNER_TEMP/quality-metrics.jsonl" -- node scripts/quality/run-lane.mjs --plan "$RUNNER_TEMP/quality-plan.json" --lane label-triage-python

      - name: Run standalone script tests
        if: steps.classify.outputs.scripts == 'true'
        run: node scripts/quality/measure.mjs --lane scripts --metrics "$RUNNER_TEMP/quality-metrics.jsonl" -- node scripts/quality/run-lane.mjs --plan "$RUNNER_TEMP/quality-plan.json" --lane scripts

      - name: Setup Go
        if: steps.classify.outputs.go_ssh == 'true' || steps.classify.outputs.go_dns == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          cache: false
          cache-dependency-path: |
            apps/ssh/go.sum
            apps/dns/go.sum
          go-version-file: apps/ssh/go.mod

      - name: Check Go SSH once
        if: steps.classify.outputs.go_ssh == 'true'
        run: node scripts/quality/measure.mjs --lane go-ssh --metrics "$RUNNER_TEMP/quality-metrics.jsonl" -- node scripts/quality/run-lane.mjs --plan "$RUNNER_TEMP/quality-plan.json" --lane go-ssh

      - name: Check Go DNS once
        if: steps.classify.outputs.go_dns == 'true'
        run: node scripts/quality/measure.mjs --lane go-dns --metrics "$RUNNER_TEMP/quality-metrics.jsonl" -- node scripts/quality/run-lane.mjs --plan "$RUNNER_TEMP/quality-plan.json" --lane go-dns

      - name: Setup Rust
        if: steps.classify.outputs.sonar == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy, rustfmt
          toolchain: stable

      - name: Restore bounded Cargo snapshot
        id: cargo_cache
        if: steps.classify.outputs.sonar == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/sonar/target
          key: cargo-quality-v2-${{ runner.os }}-${{ hashFiles('apps/sonar/Cargo.lock') }}-${{ steps.cache_epoch.outputs.week }}
          restore-keys: |
            cargo-quality-v2-${{ runner.os }}-${{ hashFiles('apps/sonar/Cargo.lock') }}-
            cargo-quality-v2-${{ runner.os }}-

      - name: Check Rust Sonar
        if: steps.classify.outputs.sonar == 'true'
        run: node scripts/quality/measure.mjs --lane sonar --metrics "$RUNNER_TEMP/quality-metrics.jsonl" -- node scripts/quality/run-lane.mjs --plan "$RUNNER_TEMP/quality-plan.json" --lane sonar

      - name: Validate workflow syntax and topology
        if: steps.classify.outputs.workflows == 'true'
        run: node scripts/quality/measure.mjs --lane workflows --metrics "$RUNNER_TEMP/quality-metrics.jsonl" -- node scripts/quality/run-lane.mjs --plan "$RUNNER_TEMP/quality-plan.json" --lane workflows

      - name: Save bounded Turbo snapshot from main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.classify.outputs.turbo == 'true' && steps.turbo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: ${{ steps.turbo_cache.outputs.cache-primary-key }}
          path: .turbo/cache

      - name: Save bounded Cargo snapshot from main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.classify.outputs.sonar == 'true' && steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/sonar/target

      - name: Report selected closure and cost projection
        if: always()
        env:
          CACHE_HIT: ${{ steps.turbo_cache.outputs.cache-hit || 'not-selected' }}
        run: node scripts/quality/report-run.mjs --plan "$RUNNER_TEMP/quality-plan.json" --metrics "$RUNNER_TEMP/quality-metrics.jsonl" --job core --cache-hit "$CACHE_HIT"

  e2e:
    name: Public flows when selected (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    outputs:
      playwright_cache_key: ${{ steps.playwright_cache.outputs.cache-primary-key }}
    needs: pr_state
    if: ${{ !cancelled() && needs.pr_state.outputs.run != 'false' && needs.pr_state.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SQLD_SHA256: 71720fc8648c19efef416efebd47145ef59b62e198770533530a858e1336879f
      SQLD_VERSION: v0.24.32
      TURSO_CLI_SHA256: f3595d4af3385e691f68152ae24b1ffa3768413fa007c3cccfb3681937f52502
      TURSO_CLI_VERSION: v1.0.33
    steps:
      - name: Checkout code and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify dependency closure
        id: classify
        run: |
          args=(--base "$QUALITY_BASE" --head "$QUALITY_HEAD" --output "$RUNNER_TEMP/quality-plan.json" --github-output "$GITHUB_OUTPUT")
          if [ "$QUALITY_FORCE_FULL" = "true" ]; then
            args+=(--force-full --full-reason "scheduled or operator-requested full backstop")
          fi
          node scripts/quality/classify.mjs "${args[@]}"

      - name: Skip non-web changes
        if: steps.classify.outputs.e2e != 'true'
        run: echo "Public-web E2E is outside this dependency closure."

      - name: Start E2E shard report
        if: steps.classify.outputs.e2e == 'true'
        run: |
          printf '%s\n' "## Public flow shard ${{ matrix.shard }}/4" "" "| Lane | Outcome | Duration |" "| --- | --- | ---: |" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        if: steps.classify.outputs.e2e == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: steps.classify.outputs.e2e == 'true'
        run: bun install --frozen-lockfile

      - name: Install Turso CLI
        if: steps.classify.outputs.e2e == 'true'
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
            -o /tmp/turso-cli.tar.gz "https://github.com/tursodatabase/turso-cli/releases/download/${TURSO_CLI_VERSION}/turso-cli_Linux_x86_64.tar.gz"
          echo "${TURSO_CLI_SHA256}  /tmp/turso-cli.tar.gz" | sha256sum -c -
          tar -xzf /tmp/turso-cli.tar.gz -C /tmp turso
          sudo install -m 0755 /tmp/turso /usr/local/bin/turso

      - name: Install sqld
        if: steps.classify.outputs.e2e == 'true'
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
            -o /tmp/sqld.tar.xz "https://github.com/tursodatabase/libsql/releases/download/libsql-server-${SQLD_VERSION}/libsql-server-x86_64-unknown-linux-gnu.tar.xz"
          echo "${SQLD_SHA256}  /tmp/sqld.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sqld.tar.xz -C /tmp
          sudo install -m 0755 /tmp/libsql-server-x86_64-unknown-linux-gnu/sqld /usr/local/bin/sqld

      - name: Restore Playwright browsers
        id: playwright_cache
        if: steps.classify.outputs.e2e == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          path: ~/.cache/ms-playwright
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.classify.outputs.e2e == 'true'
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Run the full deterministic public-web contract
        if: steps.classify.outputs.e2e == 'true'
        run: node scripts/quality/measure.mjs --lane e2e-${{ matrix.shard }}/4 --metrics "$RUNNER_TEMP/quality-metrics.jsonl" -- node scripts/quality/run-lane.mjs --plan "$RUNNER_TEMP/quality-plan.json" --lane e2e --shard ${{ matrix.shard }}/4

      - name: Save Playwright browsers from main
        if: success() && matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.classify.outputs.e2e == 'true' && steps.playwright_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: ${{ steps.playwright_cache.outputs.cache-primary-key }}
          path: ~/.cache/ms-playwright

      - name: Upload front-door journey evidence
        if: always() && steps.classify.outputs.e2e == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: ignore
          include-hidden-files: true
          name: front-door-scroll-${{ matrix.shard }}
          path: apps/web/.dev/front-door/
          retention-days: 30

      - name: Upload track journey evidence
        if: always() && steps.classify.outputs.e2e == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: ignore
          include-hidden-files: true
          name: track-journey-${{ matrix.shard }}
          path: apps/web/.dev/track-journey/
          retention-days: 30

      - name: Upload search journey evidence
        if: always() && steps.classify.outputs.e2e == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: ignore
          include-hidden-files: true
          name: search-surface-${{ matrix.shard }}
          path: apps/web/.dev/search/
          retention-days: 30

      - name: Upload discovery event evidence
        if: always() && steps.classify.outputs.e2e == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: ignore
          include-hidden-files: true
          name: discovery-events-${{ matrix.shard }}
          path: apps/web/.dev/discovery-events/
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure() && steps.classify.outputs.e2e == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          include-hidden-files: true
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/.dev/e2e-turso.log
          retention-days: 7

      - name: Report E2E duration and projection
        if: always() && steps.classify.outputs.e2e == 'true'
        run: node scripts/quality/report-run.mjs --plan "$RUNNER_TEMP/quality-plan.json" --metrics "$RUNNER_TEMP/quality-metrics.jsonl" --job e2e-${{ matrix.shard }}/4 --cache-hit "${{ steps.playwright_cache.outputs.cache-hit || 'miss' }}"

  cache_cleanup:
    name: Retain current main cache snapshots
    continue-on-error: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.pr_state.outputs.reused != 'true'
    needs: [pr_state, core, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout cache maintenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Remove older quality snapshots after successful saves
        env:
          GH_TOKEN: ${{ github.token }}
          TURBO_CACHE_KEY: ${{ needs.core.outputs.turbo_cache_key }}
          CARGO_CACHE_KEY: ${{ needs.core.outputs.cargo_cache_key }}
          PLAYWRIGHT_CACHE_KEY: ${{ needs.e2e.outputs.playwright_cache_key }}
        run: node scripts/quality/cache-prune.mjs

      - name: Report cache maintenance failure
        if: failure()
        run: echo "::warning::Cache retention failed; the next successful main run will retry."

  gate:
    name: Lint, Format, and Typecheck
    if: ${{ !cancelled() && needs.pr_state.outputs.run != 'false' }}
    needs: pr_state
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: Hold the stable protected result
        if: needs.pr_state.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for ((attempt = 0; attempt < 120; attempt++)); do
            jobs=$(gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100")
            lanes=$(jq '[.[].jobs[] | select(.name == "Selected quality lanes" or (.name | test("^Public flows when selected \\([1-4]/4\\)$")))]' <<< "$jobs")
            if jq -e 'any(.[]; .status == "completed" and .conclusion != "success")' <<< "$lanes" > /dev/null; then
              echo "::error::Selected quality lanes did not all succeed: $lanes"
              exit 1
            fi
            if jq -e 'length == 5 and ([.[].name] | unique | length == 5) and all(.[]; .status == "completed" and .conclusion == "success")' <<< "$lanes" > /dev/null; then
              echo "Core and all four E2E owners succeeded in run $RUN_ID attempt $RUN_ATTEMPT."
              exit 0
            fi
            echo "Waiting for selected quality owners: $lanes"
            sleep 15
          done
          echo "::error::Timed out waiting for selected quality owners."
          exit 1

      - name: Report reused PR validation
        if: needs.pr_state.outputs.reused == 'true'
        run: echo "Core and E2E reuse the matching PR tree proof reported by PR readiness."

      - name: Checkout executed PR tree
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind successful lanes to the executed PR tree
        id: proof
        if: github.event_name == 'pull_request'
        run: node scripts/quality/source-proof.mjs create "$RUNNER_TEMP/quality-source-proof.json"

      - name: Upload PR tree proof
        if: steps.proof.outputs.created == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-source-proof
          path: ${{ runner.temp }}/quality-source-proof.json
          retention-days: 7
          if-no-files-found: error
