name: Discovery Walk

# The live walk of the three public discovery journeys (apps/web/scripts/discovery-walk.ts):
# a stranger at desktop 1440×900 and mobile 390×844 against the SERVED product, retaining per
# step a full-page screenshot, the observed destination, canonical + robots, the outbound
# listening target, every analytics request, and any console error. Quality Checks' selected,
# hermetic E2E job is the GATE for these journeys; this is the RECORD of what the integrated
# product actually did with real current data, kept where a verifier can reach it without a checkout.
#
# Two explicit triggers, one artifact:
#   - workflow_run (Post-deploy Probe succeeded): production now serves the pushed commit, so
#     this walk attributes to exactly that deploy. Post-deploy always reports, including a cheap
#     intentional skip; this job inspects the triggering run and proceeds only when its public
#     surface sweep actually passed. `workflow_run` fires only for the default branch.
#   - workflow_dispatch: an operator can record another deployment deliberately.
#
# Pull requests are deliberately absent. Quality Checks' selected hermetic E2E suite is the PR
# gate; walking current production cannot prove candidate code and used to add a full browser run
# to every docs, CLI, and other non-web PR outside the selected dependency closure.
#
# No secrets: public GETs and clicks only; the browser never leaves the site (an outbound
# popup is recorded and closed). The walk exits non-zero if a journey cannot complete, and
# that IS the signal — a step that stopped resolving on the live product.
#
# The evidence directory is gitignored on purpose (a public repo must not accumulate binary
# screenshots that go stale the moment a style moves; see apps/web/tests/e2e/README.md), so
# the durable home is the run artifact: `discovery-walk`, retained 90 days (the ceiling on a
# public repo), uploaded green or red, with `summary.md` printed into the job summary so the
# destinations read on the run page itself.

on:
  workflow_run:
    workflows: ["Post-deploy Probe"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base:
        description: "Deployment to walk (origin, no trailing slash)"
        default: "https://www.fluncle.com"
        required: false
        type: string

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.ref }}

permissions:
  actions: read
  contents: read

jobs:
  walk:
    name: Walk the public discovery journeys (chromium)
    # A workflow_run only counts when the probe it follows went green.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirm the triggering run completed a deploy sweep
        id: deploy_trigger
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          swept="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_RUN_ID}/jobs?per_page=100" --jq '[.jobs[].steps[]? | select(.name == "Sweep public surfaces" and .conclusion == "success")] | length')"
          if [ "$swept" -gt 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "The triggering Post-deploy Probe intentionally skipped deployment; skipping the live walk."
          fi

      - name: Checkout code
        if: github.event_name != 'workflow_run' || steps.deploy_trigger.outputs.enabled == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # workflow_run otherwise checks out the latest default branch, which can move beyond the
          # deploy being recorded. Bind the harness to the exact triggering main commit.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        if: github.event_name != 'workflow_run' || steps.deploy_trigger.outputs.enabled == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json # single source: packageManager — pin-drift bumps that, every workflow follows

      - name: Install dependencies
        if: github.event_name != 'workflow_run' || steps.deploy_trigger.outputs.enabled == 'true'
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        if: github.event_name != 'workflow_run' || steps.deploy_trigger.outputs.enabled == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        if: github.event_name != 'workflow_run' || steps.deploy_trigger.outputs.enabled == 'true'
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Walk the journeys
        if: github.event_name != 'workflow_run' || steps.deploy_trigger.outputs.enabled == 'true'
        working-directory: apps/web
        env:
          WALK_BASE: ${{ inputs.base || 'https://www.fluncle.com' }}
        run: bun run walk:discovery

      # The journey table on the run page itself, before anyone downloads a byte. `always()`
      # because a failed walk's partial record is exactly what the reader needs then.
      - name: Print the journey summary
        if: always() && (github.event_name != 'workflow_run' || steps.deploy_trigger.outputs.enabled == 'true')
        run: |
          if [ -f apps/web/.dev/discovery-walk/summary.md ]; then
            cat apps/web/.dev/discovery-walk/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The walk produced no summary (it did not reach its first step)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Same terms as the Quality Checks evidence artifacts: never committed, kept per run for the 90-day
      # ceiling a public repo allows, uploaded green or red, and an EMPTY directory is a failure
      # (evidence that does not exist is not evidence).
      - name: Upload discovery-walk evidence
        if: always() && (github.event_name != 'workflow_run' || steps.deploy_trigger.outputs.enabled == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: discovery-walk
          path: apps/web/.dev/discovery-walk/
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
