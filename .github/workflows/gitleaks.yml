name: gitleaks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: gitleaks-${{ github.ref }}

jobs:
  pr_state:
    name: PR readiness
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.live.outputs.run }}
    steps:
      - name: Read live PR draft state
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PAYLOAD_DRAFT: ${{ toJSON(github.event.pull_request.draft) }}
        shell: bash
        run: |
          set -euo pipefail
          live_draft=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            live_draft=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.draft')
          fi
          case "$live_draft" in
            false) run=true ;;
            true) run=false ;;
            *) echo "::error::Invalid live PR draft state: $live_draft"; exit 1 ;;
          esac
          echo "payload_draft=$PAYLOAD_DRAFT live_draft=$live_draft run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan git history for committed secrets
    needs: pr_state
    if: ${{ !cancelled() && needs.pr_state.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config=/repo/.gitleaks.toml --redact --exit-code 1 --no-banner # v8.30.1

      - name: op:// path hygiene (working tree)
        run: |
          if git grep -nE 'op://[A-Za-z0-9]'; then
            echo "::error::Concrete op:// 1Password path in a committed file — use a placeholder (op://\$FLUNCLE_1PASSWORD_ENV_ITEM/...). See AGENTS.md 'Public Repo'."
            exit 1
          fi

      - name: local-path hygiene (working tree)
        run: |
          if git grep -nE '/Users/[a-z]' -- . \
            ':!AGENTS.md' \
            ':!packages/skills/fluncle-maintenance/references/bump-procedure.md' \
            ':!.agents/skills/fluncle-maintenance/references/bump-procedure.md'; then
            echo "::error::Local /Users/... path in a committed file — operator topology stays in the private companion repo. See AGENTS.md 'Public Repo'."
            exit 1
          fi
