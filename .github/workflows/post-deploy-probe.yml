name: Post-deploy Probe

# Cloudflare Workers Builds terminal events are the fast path. Until their external Queue,
# subscription, relay Worker, and GitHub dispatch have been proven live, every deployable push also
# starts the bounded polling fallback. Excluded pushes still enter this workflow, classify in a few
# seconds from the same watch-path source as Cloudflare, and skip all setup and probing.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [cloudflare-workers-build]
  workflow_dispatch:
    inputs:
      build_uuid:
        description: Cloudflare build UUID for rollout testing
        required: true
        type: string
      sha:
        description: Exact commit Cloudflare built
        required: true
        type: string
      status:
        description: Terminal Cloudflare build status
        options: [succeeded, failed, canceled]
        required: true
        type: choice

concurrency:
  cancel-in-progress: true
  group: post-deploy-${{ github.event_name == 'push' && 'fallback' || github.event.client_payload.build_uuid || inputs.build_uuid || github.run_id }}

permissions:
  contents: read

jobs:
  probe:
    name: Correlate deploy, then sweep surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Event payloads are data, not checkout authority. Resolve them with code from pushed main,
      # validate the exact SHA against origin/main, and only then execute that commit's probe.
      - name: Checkout trusted workflow code and full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.sha || 'refs/heads/main' }}

      - name: Resolve event and deploy watch-path decision
        id: deploy
        run: node scripts/quality/resolve-deploy.mjs --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --output .deploy-event.json --github-output "$GITHUB_OUTPUT"

      - name: Skip a configured non-deploy change
        if: steps.deploy.outputs.enabled != 'true'
        run: echo "The canonical Cloudflare watch-path contract excludes every changed path."

      - name: Surface failed or canceled Workers Build
        if: steps.deploy.outputs.enabled == 'true' && steps.deploy.outputs.status != 'succeeded'
        env:
          BUILD_STATUS: ${{ steps.deploy.outputs.status }}
          BUILD_UUID: ${{ steps.deploy.outputs.build_uuid }}
          TARGET_SHA: ${{ steps.deploy.outputs.sha }}
        run: |
          echo "::error::Cloudflare Workers Build $BUILD_UUID ended $BUILD_STATUS for $TARGET_SHA. A retry produces a new terminal event and a new correlated run."
          exit 1

      - name: Checkout correlated deploy code
        if: steps.deploy.outputs.enabled == 'true' && steps.deploy.outputs.status == 'succeeded'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.deploy.outputs.sha }}

      - name: Setup Bun
        if: steps.deploy.outputs.enabled == 'true' && steps.deploy.outputs.status == 'succeeded'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: steps.deploy.outputs.enabled == 'true' && steps.deploy.outputs.status == 'succeeded'
        run: bun install --frozen-lockfile

      - name: Wait for exact or coalesced deployment
        if: steps.deploy.outputs.enabled == 'true' && steps.deploy.outputs.status == 'succeeded'
        env:
          MODE: ${{ steps.deploy.outputs.mode }}
          TARGET_SHA: ${{ steps.deploy.outputs.sha }}
        run: |
          deadline=180
          if [ "$MODE" = "poll-fallback" ]; then deadline=1200; fi
          node scripts/quality/measure.mjs --lane deploy-wait --metrics .post-deploy-metrics.jsonl -- node scripts/quality/wait-for-deploy.mjs --target "$TARGET_SHA" --deadline "$deadline"

      - name: Sweep public surfaces
        if: steps.deploy.outputs.enabled == 'true' && steps.deploy.outputs.status == 'succeeded'
        run: node scripts/quality/measure.mjs --lane surface-probe --metrics .post-deploy-metrics.jsonl -- bun run --cwd apps/web scripts/post-deploy-probe.ts

      - name: Report wait versus probe time
        if: always() && steps.deploy.outputs.enabled == 'true'
        run: node scripts/quality/post-deploy-report.mjs .post-deploy-metrics.jsonl
